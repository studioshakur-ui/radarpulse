name: "db: docs (RadarPulse)"

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  schedule:
    # Every 6 hours (UTC): 00:15, 06:15, 12:15, 18:15
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  generate-db-docs:
    if: ${{ github.actor != 'radarpulse-bot' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x scripts/db/update-db-docs.sh

      - name: Generate docs/db artifacts
        env:
          DATABASE_URL: ${{ secrets.RADARPULSE_DATABASE_URL }}
          SCHEMAS: "public"
        run: ./scripts/db/update-db-docs.sh

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No DB docs changes."
            exit 0
          fi

          git config user.name "radarpulse-bot"
          git config user.email "radarpulse-bot@users.noreply.github.com"

          git add -A docs/db
          git commit -m "db: update schema snapshot + canonical view"
          git push
