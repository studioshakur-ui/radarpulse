name: RadarPulse 15m

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: radarpulse-15m
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dispatcher + Worker (drain queue)
        env:
          SUPABASE_REF: ${{ secrets.SUPABASE_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          BASE="https://${SUPABASE_REF}.supabase.co/functions/v1"
          H1="apikey: ${SUPABASE_ANON_KEY}"
          H2="Authorization: Bearer ${SUPABASE_ANON_KEY}"
          H3="Content-Type: application/json"

          echo "==> dispatcher"
          DISP=$(curl -sS -X POST "${BASE}/dispatcher" -H "${H1}" -H "${H2}" -H "${H3}" -d '{}' )
          echo "${DISP}" | jq .

          echo "==> worker loop (drain queue)"
          for i in $(seq 1 25); do
            RES=$(curl -sS -X POST "${BASE}/worker" -H "${H1}" -H "${H2}" -H "${H3}" -d '{}' || true)

            echo "${RES}" | jq . >/dev/null 2>&1 || { echo "Non-JSON response:"; echo "${RES}"; exit 1; }

            OK=$(echo "${RES}" | jq -r '.ok // false')
            MSG=$(echo "${RES}" | jq -r '.message // ""')

            echo "worker[$i] => ok=${OK} message=${MSG}"
            echo "${RES}" | jq .

            if [ "${OK}" = "true" ] && [ "${MSG}" = "no_jobs" ]; then
              echo "Queue empty."
              break
            fi

            if [ "${OK}" != "true" ]; then
              echo "Worker returned ok=false"
              exit 1
            fi
          done
