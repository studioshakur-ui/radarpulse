name: RadarPulse 15m

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: radarpulse-15m
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Dispatcher + Worker (drain queue)
        shell: bash
        env:
          SUPABASE_REF: ${{ secrets.SUPABASE_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAX_WORKER_CALLS: "40"
          CURL_MAX_TIME: "90"
          CURL_RETRIES: "1"
          SLEEP_BETWEEN_CALLS_MS: "250"
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          if [ -z "${SUPABASE_REF:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secrets: SUPABASE_REF or SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE="https://${SUPABASE_REF}.supabase.co/functions/v1"

          H_APIKEY="apikey: ${SUPABASE_ANON_KEY}"
          H_CT="Content-Type: application/json"

          CURL_OPTS=(
            -sS
            --max-time "${CURL_MAX_TIME}"
            --retry "${CURL_RETRIES}"
            --retry-all-errors
            --retry-delay 1
          )

          sleep_ms() {
            local ms="${1:-0}"
            if [ -z "${ms}" ] || [ "${ms}" = "0" ]; then return 0; fi
            python3 - <<'PY'
          import os, time
          ms = float(os.environ.get("SLEEP_MS", "0"))
          time.sleep(ms/1000.0)
          PY
          }

          split_http() {
            local resp="$1"
            HTTP_CODE="${resp##*$'\n'}"
            HTTP_BODY="${resp%$'\n'*}"
          }

          assert_json_file() {
            local file="$1"
            if ! jq . < "${file}" >/dev/null 2>&1; then
              echo "NON_JSON_RESPONSE:"
              cat "${file}" || true
              exit 1
            fi
          }

          post_json() {
            local url="$1"
            local body="$2"
            local resp
            resp="$(curl "${CURL_OPTS[@]}" -w $'\n%{http_code}' -X POST "${url}" \
              -H "${H_APIKEY}" -H "${H_CT}" -d "${body}" || true)"
            split_http "${resp}"
            printf '%s' "${HTTP_BODY}" > /tmp/resp.json

            if ! [[ "${HTTP_CODE}" =~ ^[0-9]{3}$ ]]; then
              echo "HTTP_CODE_PARSE_ERROR: ${HTTP_CODE}"
              cat /tmp/resp.json || true
              exit 1
            fi

            assert_json_file /tmp/resp.json

            if [ "${HTTP_CODE}" -ge 400 ]; then
              echo "HTTP_ERROR ${HTTP_CODE}:"
              jq . < /tmp/resp.json
              exit 1
            fi

            jq . < /tmp/resp.json
          }

          echo "==> dispatcher"
          post_json "${BASE}/dispatcher" '{}'

          echo "==> worker drain"
          max_calls="${MAX_WORKER_CALLS}"

          fetched_total=0
          upserted_raw_total=0
          upserted_opportunities_total=0
          failed_items_total=0
          ai_processed_total=0
          ai_failures_total=0
          jobs_done=0

          for i in $(seq 1 "${max_calls}"); do
            echo "-- worker call #${i}"

            resp="$(curl "${CURL_OPTS[@]}" -w $'\n%{http_code}' -X POST "${BASE}/worker" \
              -H "${H_APIKEY}" -H "${H_CT}" -d '{"max_jobs":1,"disable_ai":true,"max_ai_per_job":0,"soft_deadline_ms":45000}' || true)"
            split_http "${resp}"
            printf '%s' "${HTTP_BODY}" > /tmp/worker.json

            assert_json_file /tmp/worker.json

            if [ "${HTTP_CODE}" -ge 400 ]; then
              echo "WORKER_HTTP_ERROR ${HTTP_CODE}:"
              jq . < /tmp/worker.json
              exit 1
            fi

            ok="$(jq -r '.ok // false' < /tmp/worker.json)"
            msg="$(jq -r '.message // ""' < /tmp/worker.json)"
            result_count="$(jq -r '(.results // []) | length' < /tmp/worker.json)"

            echo "worker[$i] => ok=${ok} message=${msg} results=${result_count}"
            jq . < /tmp/worker.json

            if [ "${ok}" != "true" ]; then
              echo "WORKER_RETURNED_ok=false"
              exit 1
            fi

            if [ "${msg}" = "no_jobs" ]; then
              echo "Queue empty."
              break
            fi

            if [ "${result_count}" = "0" ]; then
              echo "WORKER_RETURNED_NO_RESULTS"
              exit 1
            fi

            while IFS= read -r row; do
              source="$(jq -r '.source // "unknown"' <<< "${row}")"
              fetched="$(jq -r '.fetched_count // 0' <<< "${row}")"
              up_raw="$(jq -r '.upserted_raw // 0' <<< "${row}")"
              up_opp="$(jq -r '.upserted_opportunities // 0' <<< "${row}")"
              failed_items="$(jq -r '.failed_items // 0' <<< "${row}")"
              ai_processed="$(jq -r '.ai_processed // 0' <<< "${row}")"
              ai_failures="$(jq -r '.ai_failures // 0' <<< "${row}")"
              row_ok="$(jq -r '.ok // false' <<< "${row}")"
              row_error="$(jq -r '.error // ""' <<< "${row}")"

              echo "source=${source} ok=${row_ok} fetched=${fetched} raw=${up_raw} opp=${up_opp} failed_items=${failed_items} ai_processed=${ai_processed} ai_failures=${ai_failures}"

              if [ "${row_ok}" != "true" ]; then
                echo "WORKER_RESULT_FAILED source=${source} error=${row_error}"
                exit 1
              fi

              fetched_total=$((fetched_total + fetched))
              upserted_raw_total=$((upserted_raw_total + up_raw))
              upserted_opportunities_total=$((upserted_opportunities_total + up_opp))
              failed_items_total=$((failed_items_total + failed_items))
              ai_processed_total=$((ai_processed_total + ai_processed))
              ai_failures_total=$((ai_failures_total + ai_failures))
              jobs_done=$((jobs_done + 1))
            done < <(jq -c '.results[]' /tmp/worker.json)

            export SLEEP_MS="${SLEEP_BETWEEN_CALLS_MS}"
            sleep_ms "${SLEEP_BETWEEN_CALLS_MS}"
          done

          echo "==> Summary"
          echo "jobs_done=${jobs_done} fetched=${fetched_total} upserted_raw=${upserted_raw_total} upserted_opportunities=${upserted_opportunities_total} failed_items=${failed_items_total} ai_processed=${ai_processed_total} ai_failures=${ai_failures_total}"
