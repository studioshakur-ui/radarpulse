<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FCFBFF" />
    <title>RadarPulse</title>

    <!-- Single-theme bootstrap: RadarPulse currently ships one curated Twilight surface -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          localStorage.setItem("rp_theme", "light");
          el.classList.remove("dark");
          el.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
