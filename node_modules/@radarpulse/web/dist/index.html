<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A10" />
    <title>RadarPulse</title>

    <!-- Theme bootstrap (prevents flash). Values: auto | light | dark -->
    <script>
      (function () {
        try {
          var key = "rp_theme";
          var mode = (localStorage.getItem(key) || "auto").trim();
          if (mode !== "auto" && mode !== "light" && mode !== "dark") mode = "auto";

          var prefersDark = false;
          try {
            prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}

          var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;

          var el = document.documentElement;
          if (resolved === "dark") el.classList.add("dark");
          else el.classList.remove("dark");
          el.dataset.theme = resolved;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-mJidBEjn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CsZQYSUM.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
